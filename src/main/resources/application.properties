spring.application.name=employee-manangement

# =============================================
# Active Profile  (override: -Dspring.profiles.active=prod)
# =============================================
spring.profiles.active=dev

# =============================================
# Shared JPA / Hibernate Configuration
# =============================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================
# JWT Configuration
# Secret là chuỗi Base64 encode của 32+ bytes
# Tạo bằng: openssl rand -base64 32
# =============================================
jwt.secret=ZW1wbG95ZWUtbWFuYWdlbWVudC1zdXBlci1zZWNyZXQta2V5LTIwMjY=
jwt.expiration-ms=3600000
